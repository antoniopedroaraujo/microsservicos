
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          routes:
            # Rota para MSUSUARIO
            - id: msusuario
              uri: lb://msusuario
              predicates:
                - Path=/api/v1/usuarios,/api/v1/usuarios/**

            # Rota para MSEQUIPAMENTO
            - id: msequipamento
              uri: lb://msequipamento
              predicates:
                - Path=/api/v1/equipamentos,/api/v1/equipamentos/**

            # Rota para MSEMPRESTIMO
            - id: msemprestimo
              uri: lb://msemprestimo
              predicates:
                - Path=/api/v1/emprestimos,/api/v1/emprestimos/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
